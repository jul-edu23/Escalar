<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalar | Login</title>

    <!--Google font - inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <!--Icones-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/global.css">

    <style>
        
        #mensagem {
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .form-label {
            color: var(--branco);
            font-weight: 500;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }

        .recuperarSenha a {
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .recuperarSenha a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 imagem d-none d-md-block logomarca p-0">
                <div class="fundo">
                    <div class="container d-flex flex-column justify-content-between" style="height: 100vh; max-width: 680px;">
                        <div class="caixa align-self-start">a melhor maneira de</div>
                        <div class="caixa logo m-5">
                            <img src="assets/img/escalar-removebg-preview.png" class="img-fluid" alt="Escalar">
                        </div>
                        <div class="caixa align-self-end">sua gestão</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 container-login d-flex flex-column justify-content-center align-items-center">

                <div class="logo logo-mobile mb-4" style="display: none; max-width: 319px;">
                    <img src="assets/img/escalar-removebg-preview.png" class="img-fluid" alt="Escalar">
                </div>
                <div class="formulario-login w-75">
                    <div class="text-center mb-4 textoSaudacao">
                        <h2 style="font-size: 2.5rem;">Bem-vindo!</h2>
                    </div>

                    <!-- Mensagens de feedback la -->
                    <div id="mensagem" class="alert alert-dismissible fade" role="alert" style="display: none;">
                        <span id="mensagem-texto"></span>
                        <button type="button" class="btn-close" onclick="fecharMensagem()"></button>
                    </div>

                    <form id="formLogin" onsubmit="fazerLogin(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" name="email" class="form-control" id="email" required placeholder="seu.email@exemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha:</label>
                            <input type="password" name="senha" id="senha" class="form-control" required placeholder="Digite sua senha">
                        </div>
                        
                        <div class="recuperarSenha mb-3 text-center">
                            <a href="recuperarSenha.html">
                                <i class="bi bi-key"></i> Esqueci minha senha
                            </a>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="botaoEntrar mt-4 mb-3" id="btnEntrar">
                                <i class="bi bi-box-arrow-in-right iconeEntrar"></i> Entrar
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <small style="color: var(--branco); opacity: 0.8;">
                            <i class="bi bi-info-circle"></i> 
                            Primeira vez? Use seu CPF como senha.
                        </small>
                    </div>
                </div>
            </div>




            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>

            <script>
                // URL da API de login,substituir dps
                const API_URL = 'http://127.0.0.1:5001';

                // mostrar mensagens
                function mostrarMensagem(texto, tipo = 'info') {
                    const mensagemDiv = document.getElementById('mensagem');
                    const mensagemTexto = document.getElementById('mensagem-texto');
                    
                    mensagemDiv.className = `alert alert-${tipo} alert-dismissible fade show`;
                    mensagemTexto.textContent = texto;
                    mensagemDiv.style.display = 'block';
                    
                    // Auto-fechar após 5 segundos
                    setTimeout(() => {
                        fecharMensagem();
                    }, 5000);
                }

                function fecharMensagem() {
                    const mensagemDiv = document.getElementById('mensagem');
                    mensagemDiv.style.display = 'none';
                }

                // login
                async function fazerLogin(event) {
                    event.preventDefault();
                    
                    const btnEntrar = document.getElementById('btnEntrar');
                    const email = document.getElementById('email').value.trim();
                    const senha = document.getElementById('senha').value;
                    
                    // Desabilita o botão 
                    btnEntrar.disabled = true;
                    btnEntrar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Entrando...';
                    
                    try {
                        const response = await fetch(`${API_URL}/api/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, senha })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.success) {
                            mostrarMensagem(data.message, 'success');
                            
                            // Aguarda 1 segundo e redireciona
                            setTimeout(() => {
                                window.location.href = `${API_URL}${data.redirect}`;
                            }, 1000);
                        } else {
                            mostrarMensagem(data.error || 'Erro ao fazer login', 'danger');
                            btnEntrar.disabled = false;
                            btnEntrar.innerHTML = '<i class="bi bi-box-arrow-in-right iconeEntrar"></i> Entrar';
                        }
                    } catch (error) {
                        console.error('Erro:', error);
                        mostrarMensagem('Erro ao conectar com o servidor. Verifique se o sistema está rodando.', 'danger');
                        btnEntrar.disabled = false;
                        btnEntrar.innerHTML = '<i class="bi bi-box-arrow-in-right iconeEntrar"></i> Entrar';
                    }
                }

                // Verifica
                window.addEventListener('DOMContentLoaded', async () => {
                    try {
                        const response = await fetch(`${API_URL}/verificar-sessao`);
                        const data = await response.json();
                        
                        if (data.logado) {
                            // Se já  logado, redireciona para o dashboard
                            const redirect = data.usuario.nivel_acesso === 'administrador' 
                                ? '/dashboard-admin' 
                                : '/dashboard-colaborador';
                            window.location.href = `${API_URL}${redirect}`;
                        }
                    } catch (error) {
                        console.log('Não está logado ou servidor offline');
                    }
                });
            </script>


</body>

</html>
