    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Sistema de notificações -->
    <script src="../../assets/js/JScoordenador/trocas.js"></script>

    <script>
        const offcanvas = document.getElementById('offcanvasResponsive');
        const bodyContent = document.getElementById('offcanvasBodyContent');
        offcanvas.addEventListener('show.bs.offcanvas', function () {
            bodyContent.style.display = 'block';
        });
        offcanvas.addEventListener('hide.bs.offcanvas', function () {
            bodyContent.style.display = 'none';
        });

        // Dados
        let todasTrocas = [];
        let trocasFiltradas = [];
        let statusAtual = 'todas';

        // Carregar trocas ao iniciar
        document.addEventListener('DOMContentLoaded', carregarTrocas);

        async function carregarTrocas() {
            const loading = document.getElementById('loading');
            const erro = document.getElementById('erro');
            const listaTrocas = document.getElementById('listaTrocas');
            const vazio = document.getElementById('vazio');

            try {
                loading.style.display = 'block';
                erro.style.display = 'none';
                listaTrocas.innerHTML = '';
                vazio.style.display = 'none';

                // Buscar todas as trocas não-pendentes
                const response = await fetch('http://127.0.0.1:5000/api/trocas');
                
                if (!response.ok) {
                    throw new Error('Erro ao carregar trocas');
                }

                const result = await response.json();
                const data = result.data || result; // Suporta ambos os formatos
                todasTrocas = data.filter(t => t.status !== 'pendente');
                trocasFiltradas = todasTrocas;

                renderizarTrocas();

            } catch (error) {
                console.error('Erro:', error);
                erro.textContent = 'Erro ao carregar histórico de trocas: ' + error.message;
                erro.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function aplicarFiltros() {
            const filtroStatus = document.getElementById('filtroStatus').value;
            statusAtual = filtroStatus;
            
            if (filtroStatus === 'todas') {
                trocasFiltradas = todasTrocas;
            } else {
                trocasFiltradas = todasTrocas.filter(t => t.status === filtroStatus);
            }
            
            renderizarTrocas();
        }

        function renderizarTrocas() {
            const listaTrocas = document.getElementById('listaTrocas');
            const vazio = document.getElementById('vazio');

            if (trocasFiltradas.length === 0) {
                listaTrocas.innerHTML = '';
                vazio.style.display = 'block';
                return;
            }

            vazio.style.display = 'none';

            listaTrocas.innerHTML = trocasFiltradas.map(troca => {
                const statusClass = troca.status === 'aprovada' ? 'text-success' : 'text-danger';
                const statusTexto = troca.status === 'aprovada' ? '✓ Aprovada' : '✗ Recusada';
                const dataFormatada = formatarData(troca.data_solicitada);
                const substituto = troca.substituto_nome || 'Sem substituto especificado';

                return `
                    <div class="container-branco mb-3">
                        <div class="container justify-content-center">
                            <div class="row align-items-center">
                                <div class="col-12 col-md-6 col-lg-6 mb-3 mb-lg-0">
                                    <p><strong>Nome:</strong> ${troca.solicitante_nome}</p>
                                    <p><strong>Substituído por:</strong> ${substituto}</p>
                                    <p><strong>Motivo:</strong> ${troca.motivo || 'Não informado'}</p>
                                </div>
                                <div class="col-12 col-md-6 col-lg-3 mb-3 mb-lg-0">
                                    <p><strong>Data:</strong> ${dataFormatada}</p>
                                    <p><strong>Local:</strong> ${troca.solicitante_local || 'N/A'}</p>
                                </div>
                                <div class="col-12 col-md-12 col-lg-3 text-md-start text-lg-end">
                                    <p class="fw-bold ${statusClass}">${statusTexto}</p>
                                    <small class="text-muted">Solicitada em ${formatarData(troca.data_solicitacao)}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatarData(dataStr) {
            if (!dataStr) return 'N/A';
            const data = new Date(dataStr);
            return data.toLocaleDateString('pt-BR');
        }
    </script>
