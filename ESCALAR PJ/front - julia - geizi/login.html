<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="styles/styles.css">

</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    <form>
        <select class="tipoUsuario" name="perfil" required>
            <option value="coordenador">Coordenador</option>
            <option value="aluno">Colaborador</option>
        </select>

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Digite seu email" required />

        <label for="senha">Senha:</label>
        <input id="senha" type="password" placeholder="Digite sua senha" required />

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
