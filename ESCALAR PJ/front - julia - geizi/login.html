<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalar | Login</title>

    <!--Google font - inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <!--Icones-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/global.css">

</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 imagem d-none d-md-block logomarca p-0">
                <div class="fundo">
                    <div class="container d-flex flex-column justify-content-between" style="height: 100vh; max-width: 680px;">
                        <div class="caixa align-self-start">a melhor maneira de</div>
                        <div class="caixa logo m-5">
                            <img src="assets/img/escalar-removebg-preview.png" class="img-fluid" alt="Escalar">
                        </div>
                        <div class="caixa align-self-end">sua gestão</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 container-login d-flex flex-column justify-content-center align-items-center">

                <!-- responsivo para mobile -->
                <div class="logo logo-mobile mb-4" style="display: none; max-width: 319px;">
                    <img src="assets/img/escalar-removebg-preview.png" class="img-fluid" alt="Escalar">
                </div>
                <div class="formulario-login w-75">
                    <div class="text-center mb-4 textoSaudacao">
                        <h2 style="font-size: 2.5rem;">Bem-vindo!</h2>
                    </div>
                    <form action="">
                        <div class="mb-3">
                            <label for="exampleFormControlInput1" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="exampleFormControlInput1">
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword5" class="form-label">Senha:</label>
                            <input type="password" id="inputPassword5" class="form-control">
                        </div>
                        <div class="text-center recuperarSenha">
                            <a href="#">Esqueceu a senha?</a>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="botaoEntrar mt-4 mb-3"><i
                                    class="bi bi-box-arrow-in-right iconeEntrar"></i> Entrar</button>
                        </div>
                    </form>


                </div>
            </div>




            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>


</body>

</html>
