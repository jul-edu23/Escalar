<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="cadastro-container">
        <h2>Cadastro</h2>
        <form>
            <label for="tipoUsuario">Tipo de Usuário</label>
            <select class="tipoUsuario" id="tipoUsuario" name="tipoUsuario" required>
                <option value="">Selecione</option>
                <option value="coordenador">Coordenador</option>
                <option value="professor">Colaborador</option>
            </select>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required />

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />

            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required />

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
