<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalar | Login</title>

    <!--Google font - inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--Icones-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --azul: #00466c;
            --cinza: #d9d9d9;
            --branco: #ffffff;
            --preto: #000000;
            --sombra: 0 4px 4px 0 rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--branco);
        }

        .imagem {
            background: linear-gradient(135deg, #00466c 0%, #003d5e 100%);
            min-height: 100vh;
        }

        .fundo {
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=800');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(0, 70, 108, 0.85);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .caixa {
            color: var(--branco);
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .logo img {
            filter: brightness(0) invert(1);
            max-width: 400px;
        }

        .logo-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .logo-mobile {
                display: block !important;
            }
            
            .logo-mobile img {
                max-width: 250px;
            }
        }

        .container-login {
            min-height: 100vh;
            background-color: var(--branco);
        }

        .formulario-login {
            max-width: 450px;
            padding: 2rem;
        }

        .textoSaudacao h2 {
            color: var(--azul);
            font-weight: 700;
        }

        .form-label {
            color: var(--azul);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid var(--cinza);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 0.2rem rgba(0, 70, 108, 0.25);
        }

        .botaoEntrar {
            background-color: var(--azul);
            color: var(--branco);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--sombra);
        }

        .botaoEntrar:hover {
            background-color: #003d5e;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px 0 rgba(0, 0, 0, 0.3);
        }

        .botaoEntrar:active {
            transform: translateY(0);
        }

        .iconeEntrar {
            font-size: 1.2rem;
            margin-right: 0.5rem;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 imagem d-none d-md-block logomarca p-0">
                <div class="fundo">
                    <div class="container d-flex flex-column justify-content-between" style="height: 100vh; max-width: 680px;">
                        <div class="caixa align-self-start">a melhor maneira de</div>
                        <div class="caixa logo m-5">
                            <img src="https://via.placeholder.com/400x100/00466c/ffffff?text=ESCALAR" class="img-fluid" alt="Escalar">
                        </div>
                        <div class="caixa align-self-end">sua gestão</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 container-login d-flex flex-column justify-content-center align-items-center">
                <!-- responsivo para mobile -->
                <div class="logo logo-mobile mb-4" style="max-width: 319px;">
                    <img src="https://via.placeholder.com/300x75/00466c/ffffff?text=ESCALAR" class="img-fluid" alt="Escalar">
                </div>
                
                <div class="formulario-login w-75">
                    <div class="text-center mb-4 textoSaudacao">
                        <h2 style="font-size: 2.5rem;">Bem-vindo!</h2>
                    </div>

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" name="email" class="form-control" id="email" required 
                                   placeholder="seu.email@exemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha:</label>
                            <input type="password" name="senha" id="senha" class="form-control" required
                                   placeholder="Digite sua senha">
                        </div>
                        <div class="text-end">
                            <button type="submit" class="botaoEntrar mt-4 mb-3">
                                <i class="bi bi-box-arrow-in-right iconeEntrar"></i> Entrar
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">
                            <i class="bi bi-info-circle"></i> 
                            Primeira vez? Use seu CPF como senha.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
